<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abina K — Computer Science &amp; Engineering Portfolio</title>
    <meta name="description" content="Portfolio of Abina K, a Computer Science and Engineering student at KPR Institute of Engineering and Technology, interested in UI/UX design, software development, and technology." />
    <meta property="og:title" content="Abina K — Computer Science &amp; Engineering Portfolio" />
    <meta property="og:description" content="Portfolio of Abina K, a Computer Science and Engineering student at KPR Institute of Engineering and Technology, interested in UI/UX design, software development, and technology." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('abina-portfolio-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#101216] text-[#F5F5F2] antialiased selection:bg-[#F5A623]/25 selection:text-[#F5A623]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
